run:
  timeout: 5m
  go: "1.26"
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

linters-settings:
  govet:
    enable-all: false
  errcheck:
    check-type-assertions: true
    check-blank: false

issues:
  exclude-dirs:
    - internal/db
  exclude-rules:
    - path: internal/db/
      linters:
        - errcheck
        - staticcheck
        - unused
    - path: _test\.go
      linters:
        - errcheck
