services:
  postgres:
    image: postgres:16-alpine
    container_name: tally-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tally}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tally_secret}
      POSTGRES_DB: ${DB_NAME:-tally_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tally} -d ${DB_NAME:-tally_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  postgres_data:
    name: tally_postgres_data